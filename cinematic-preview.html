<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ساعي الخير — النسخة السينمائية التجريبية</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111b28;font-family:Tahoma,Arial,sans-serif}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 12px #1118}
.top{position:absolute;top:20px;right:22px;padding:13px 17px;border:1px solid #ffffff30;border-radius:16px;background:#101c2b75;backdrop-filter:blur(14px)}.brand{font-size:18px;font-weight:700;letter-spacing:.2px}.sub{font-size:11px;color:#f4d6a3;margin-top:5px}
#help{position:absolute;left:20px;top:20px;padding:12px 15px;background:#101c2b70;border:1px solid #ffffff25;border-radius:14px;font-size:12px;line-height:1.9;backdrop-filter:blur(12px)}
#status{position:absolute;bottom:24px;right:50%;transform:translateX(50%);padding:12px 18px;border-radius:999px;background:#111c2bd9;border:1px solid #ffffff2a;font-size:13px;white-space:nowrap;max-width:90vw;text-align:center}
#interact{position:absolute;bottom:83px;right:50%;transform:translateX(50%);pointer-events:auto;border:1px solid #f7d39c80;border-radius:999px;background:#d9a86b;color:#17202a;font-weight:bold;padding:12px 24px;font-size:14px;display:none;cursor:pointer;box-shadow:0 8px 30px #0004}
#touch{position:absolute;bottom:22px;left:20px;display:none;gap:9px;pointer-events:auto;direction:ltr}.touchbtn{width:55px;height:55px;border-radius:50%;border:1px solid #ffffff50;background:#142235a8;color:#fff;font-size:20px;touch-action:none}
#fade{position:absolute;inset:0;background:#111b28;opacity:1;pointer-events:none;animation:reveal 1.5s ease forwards}@keyframes reveal{to{opacity:0}}
@media(max-width:700px){#help{top:auto;bottom:20px;left:12px;font-size:10px;padding:8px 10px}.top{top:12px;right:12px}.brand{font-size:15px}#touch{display:flex;bottom:100px;left:12px}.touchbtn{width:48px;height:48px}#status{bottom:20px;font-size:11px;max-width:65vw;white-space:normal}}
</style></head>
<body>
<div id="hud"><div class="top"><div class="brand">ساعي الخير <span style="color:#e8bf83">✦</span></div><div class="sub">رحلة صغيرة… وأثر طيب</div></div>
<div id="help">W / ↑ حركة للأمام<br>A D / ← → توجيه الدراجة<br>E تفاعل · Space الجرس</div>
<div id="status">تأمّل الغروب… ابدأ رحلتك بالضغط على W</div><button id="interact">اسقِ القطة · E</button>
<div id="touch"><button class="touchbtn" data-key="ArrowLeft">←</button><button class="touchbtn" data-key="ArrowUp">↑</button><button class="touchbtn" data-key="ArrowRight">→</button></div></div><div id="fade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xefa879);scene.fog=new THREE.FogExp2(0xb98779,.009);
const camera=new THREE.PerspectiveCamera(57,innerWidth/innerHeight,.1,500);camera.position.set(0,4.2,10);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc8ddff,0x745345,2.0));
const sun=new THREE.DirectionalLight(0xffc58c,3.3);sun.position.set(-28,35,-45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-42;sun.shadow.camera.right=42;sun.shadow.camera.top=42;sun.shadow.camera.bottom=-42;sun.shadow.bias=-.0002;scene.add(sun);
const fill=new THREE.DirectionalLight(0x9cb9e8,.65);fill.position.set(20,8,15);scene.add(fill);
const groundMat=new THREE.MeshStandardMaterial({color:0x77795a,roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
// procedural sky gradient
const skyCanvas=document.createElement('canvas');skyCanvas.width=4;skyCanvas.height=256;const ctx=skyCanvas.getContext('2d');const grad=ctx.createLinearGradient(0,0,0,256);grad.addColorStop(0,'#344e70');grad.addColorStop(.42,'#b97c82');grad.addColorStop(.72,'#f5b17f');grad.addColorStop(1,'#ffe0a3');ctx.fillStyle=grad;ctx.fillRect(0,0,4,256);const skyTex=new THREE.CanvasTexture(skyCanvas);skyTex.colorSpace=THREE.SRGBColorSpace;const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,18),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,depthWrite:false}));scene.add(sky);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(5,32,24),new THREE.MeshBasicMaterial({color:0xffd19a}));sunDisc.position.set(-38,20,-105);scene.add(sunDisc);
function mat(color,roughness=.9,metalness=0){return new THREE.MeshStandardMaterial({color,roughness,metalness})}
const roadMat=mat(0x45474a,1),edgeMat=mat(0xb4a18b,1),lineMat=mat(0xe8d4a9,1);
const road=new THREE.Mesh(new THREE.PlaneGeometry(9,500),roadMat);road.rotation.x=-Math.PI/2;road.position.set(0,.005,-180);road.receiveShadow=true;scene.add(road);
for(const x of [-4.65,4.65]){const edge=new THREE.Mesh(new THREE.BoxGeometry(.12,.04,500),edgeMat);edge.position.set(x,.025,-180);scene.add(edge)}
for(let z=50;z>-420;z-=10){const dash=new THREE.Mesh(new THREE.BoxGeometry(.11,.018,4.2),lineMat);dash.position.set(0,.025,z);scene.add(dash)}
// fields with subtle bands
for(let side of [-1,1]){for(let i=0;i<8;i++){const strip=new THREE.Mesh(new THREE.PlaneGeometry(48,500),mat(i%2?0x858361:0x777b57));strip.rotation.x=-Math.PI/2;strip.position.set(side*(29+i*48),-.045,-180);scene.add(strip)}}
// tree models, varied canopy clusters
const trunkMat=mat(0x594032),leafMats=[mat(0x3d5b43),mat(0x506b49),mat(0x68754b),mat(0x786d4d)];
function makeTree(x,z,s){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.22*s,2.4*s,7),trunkMat);trunk.position.y=1.2*s;trunk.castShadow=true;g.add(trunk);const count=3+Math.floor(Math.random()*3);for(let i=0;i<count;i++){const r=(.65+Math.random()*.48)*s;const c=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),leafMats[Math.floor(Math.random()*leafMats.length)]);c.position.set((Math.random()-.5)*.8*s,(2.15+Math.random()*1.15)*s,(Math.random()-.5)*.7*s);c.scale.y=.85+Math.random()*.45;c.castShadow=true;c.receiveShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g);return g}
for(let z=40;z>-390;z-=8){for(const side of [-1,1]){if(Math.random()>.16)makeTree(side*(7+Math.random()*16),z+(Math.random()-.5)*4,.65+Math.random()*1.05)}}
// small rural homes
function house(x,z,s=1){const g=new THREE.Group();const wall=new THREE.Mesh(new THREE.BoxGeometry(4*s,2.6*s,3.3*s),mat(Math.random()>.5?0xc6ad8c:0xb99c7d));wall.position.y=1.3*s;wall.castShadow=true;wall.receiveShadow=true;g.add(wall);const roof=new THREE.Mesh(new THREE.ConeGeometry(3.1*s,1.7*s,4),mat(0x784e3b));roof.position.y=3.25*s;roof.rotation.y=Math.PI/4;roof.castShadow=true;g.add(roof);const door=new THREE.Mesh(new THREE.BoxGeometry(.7*s,1.45*s,.08*s),mat(0x49372e));door.position.set(.5*s,.72*s,1.69*s);g.add(door);for(const wx of [-1.25,1.25]){const win=new THREE.Mesh(new THREE.BoxGeometry(.6*s,.65*s,.08*s),new THREE.MeshStandardMaterial({color:0xf5c78c,emissive:0x9a5e28,emissiveIntensity:.35}));win.position.set(wx*s,1.55*s,1.69*s);g.add(win)}g.position.set(x,0,z);scene.add(g);return g}
house(-12,-35,1.1);house(15,-70,.85);house(-17,-115,.8);house(14,-155,1.1);house(-13,-205,.9);
// mosque ahead: dome, walls, arched entry hint, minaret
const mosque=new THREE.Group();const mw=new THREE.Mesh(new THREE.BoxGeometry(10,4.2,7),mat(0xd7c8ad));mw.position.y=2.1;mw.castShadow=true;mw.receiveShadow=true;mosque.add(mw);const dome=new THREE.Mesh(new THREE.SphereGeometry(3.2,32,20,0,Math.PI*2,0,Math.PI/2),mat(0x65877d,.55));dome.scale.y=.85;dome.position.set(0,4.2,0);dome.castShadow=true;mosque.add(dome);const minaret=new THREE.Mesh(new THREE.CylinderGeometry(.48,.7,9,12),mat(0xe0d2b8));minaret.position.set(-6,4.5,-1);minaret.castShadow=true;mosque.add(minaret);const cap=new THREE.Mesh(new THREE.ConeGeometry(.7,1.5,12),mat(0x64877d));cap.position.set(-6,9.7,-1);mosque.add(cap);const crescent=new THREE.Mesh(new THREE.TorusGeometry(.42,.07,8,24),new THREE.MeshStandardMaterial({color:0xeacb7d,metalness:.5,roughness:.35}));crescent.position.set(-6,10.5,-1);crescent.rotation.y=Math.PI/2;mosque.add(crescent);const entry=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.4,.12),mat(0x5c5144));entry.position.set(0,1.2,3.56);mosque.add(entry);mosque.position.set(10,0,-245);scene.add(mosque);
// bicycle and rider, oriented forward toward -Z
const bike=new THREE.Group();scene.add(bike);
const metal=mat(0x2e4046,.35,.65),rubber=mat(0x171b1e),skin=mat(0xb9815d),cloth=mat(0x3c6a66),pants=mat(0x303d49),shoe=mat(0x292a2b);
function rod(a,b,r,m,parent){const d=new THREE.Vector3().subVectors(b,a);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),m);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());mesh.castShadow=true;parent.add(mesh);return mesh}
function wheel(z){const w=new THREE.Group();w.position.set(0,.62,z);const tor=new THREE.Mesh(new THREE.TorusGeometry(.62,.055,10,32),rubber);tor.rotation.y=Math.PI/2;w.add(tor);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.13,12),metal);hub.rotation.z=Math.PI/2;w.add(hub);for(let i=0;i<12;i++){const a=i*Math.PI/6;rod(new THREE.Vector3(-.03,Math.cos(a)*.56,Math.sin(a)*.56),new THREE.Vector3(.03,Math.cos(a)*.56,Math.sin(a)*.56),.012,metal,w)}bike.add(w);return w}
const w1=wheel(-1.08),w2=wheel(1.0);
const pRear=new THREE.Vector3(0,.62,1),pSeat=new THREE.Vector3(0,1.28,.15),pHead=new THREE.Vector3(0,1.18,-.56),pFront=new THREE.Vector3(0,.62,-1.08);
rod(pRear,pSeat,.055,metal,bike);rod(pSeat,pHead,.055,metal,bike);rod(pHead,pFront,.055,metal,bike);rod(pSeat,new THREE.Vector3(0,.62,-.04),.055,metal,bike);rod(new THREE.Vector3(0,.62,-.04),pRear,.055,metal,bike);rod(pSeat,new THREE.Vector3(0,1.38,.27),.045,metal,bike);rod(new THREE.Vector3(0,1.38,.27),new THREE.Vector3(0,1.38,.05),.07,rubber,bike);rod(pHead,new THREE.Vector3(0,1.43,-.64),.05,metal,bike);rod(new THREE.Vector3(0,1.43,-.64),new THREE.Vector3(0,1.43,-.25),.045,rubber,bike);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.65,5,10),cloth);torso.position.set(0,2.0,-.05);torso.rotation.x=-.35;torso.castShadow=true;bike.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,18,14),skin);head.position.set(0,2.55,-.24);head.castShadow=true;bike.add(head);const cap=new THREE.Mesh(new THREE.SphereGeometry(.235,18,12,0,Math.PI*2,0,Math.PI/2),mat(0x2e494a));cap.position.set(0,2.59,-.25);bike.add(cap);
for(const side of [-1,1]){rod(new THREE.Vector3(side*.13,1.95,-.16),new THREE.Vector3(side*.28,1.48,-.52),.075,cloth,bike);rod(new THREE.Vector3(side*.28,1.48,-.52),new THREE.Vector3(side*.12,1.42,-.65),.045,skin,bike);rod(new THREE.Vector3(side*.13,1.8,.1),new THREE.Vector3(side*.17,1.12,.58),.1,pants,bike);rod(new THREE.Vector3(side*.17,1.12,.58),new THREE.Vector3(side*.16,.8,.85),.08,pants,bike);const shoeMesh=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.35),shoe);shoeMesh.position.set(side*.16,.7,.9);bike.add(shoeMesh)}
// roadside cat and water bowl
const cat=new THREE.Group();const catFur=mat(0xd0b99a);const catDark=mat(0x5b4c42);const body=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),catFur);body.scale.set(1,.72,.68);body.position.y=.38;cat.add(body);const catHead=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),catFur);catHead.position.set(0,.59,-.25);cat.add(catHead);for(const sx of [-1,1]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.09,.2,4),catDark);ear.position.set(sx*.13,.79,-.28);cat.add(ear);const leg=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.24,8),catFur);leg.position.set(sx*.18,.16,.1);cat.add(leg)}const tail=new THREE.Mesh(new THREE.TorusGeometry(.22,.045,8,16,Math.PI),catFur);tail.position.set(0,.52,.3);tail.rotation.x=Math.PI/2;cat.add(tail);cat.position.set(5,0,-92);scene.add(cat);
const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.32,.25,.12,24),mat(0x7a9da0,.25));bowl.position.set(4.4,.06,-92);scene.add(bowl);const water=new THREE.Mesh(new THREE.CircleGeometry(.25,24),new THREE.MeshStandardMaterial({color:0x80c9d2,metalness:.2,roughness:.2}));water.rotation.x=-Math.PI/2;water.position.set(4.4,.125,-92);scene.add(water);
// fireflies / floating pollen
const particles=new THREE.BufferGeometry();const positions=[];for(let i=0;i<180;i++)positions.push((Math.random()-.5)*55,Math.random()*9+.3,-Math.random()*260);particles.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));const motes=new THREE.Points(particles,new THREE.PointsMaterial({color:0xffd9a0,size:.09,transparent:true,opacity:.62}));scene.add(motes);
let speed=0,steer=0,travel=0,paused=false,catHelped=false;const keys=new Set();const status=document.querySelector('#status'),interact=document.querySelector('#interact');
function bell(){status.textContent='ترنّ نغمة الجرس في هدوء الطريق…';setTimeout(()=>{if(!catHelped)status.textContent='الطريق أمامك… وعلى جانبيه فرص للخير';},1800)}
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='e')helpCat();if(e.code==='Space')bell();});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.querySelectorAll('.touchbtn').forEach(b=>{const k=b.dataset.key.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(k)))});
function helpCat(){if(Math.abs(bike.position.z-cat.position.z)<8&&Math.abs(bike.position.x-cat.position.x)<6){catHelped=true;water.material.color.set(0x83dbe1);status.textContent='أحسنت! سقيت قطة عطشى. الخير الصغير يصنع فرقًا.';interact.style.display='none';cat.rotation.y=.15;catHead.position.y=.66}else{status.textContent='اقترب من القطة بجانب الطريق لتسقيها.'}}
interact.addEventListener('click',helpCat);
const clock=new THREE.Clock();const target=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!paused){const forward=keys.has('w')||keys.has('arrowup');const back=keys.has('s')||keys.has('arrowdown');const left=keys.has('a')||keys.has('arrowleft');const right=keys.has('d')||keys.has('arrowright');speed=THREE.MathUtils.damp(speed,forward?8.5:back?-2:0,2.2,dt);steer=THREE.MathUtils.damp(steer,(left?1:0)-(right?1:0),5,dt);bike.position.z-=speed*dt;bike.position.x+=steer*dt*Math.max(.7,Math.abs(speed)*.22);bike.position.x=THREE.MathUtils.clamp(bike.position.x,-3.1,3.1);bike.rotation.y=steer*.16;w1.rotation.x+=speed*dt;w2.rotation.x+=speed*dt;travel+=Math.abs(speed)*dt;
if(!catHelped&&Math.abs(bike.position.z-cat.position.z)<10&&Math.abs(bike.position.x-cat.position.x)<7){interact.style.display='block';status.textContent='توقّف بجوار القطة واضغط E لتسقيها'}else if(!catHelped){interact.style.display='none';if(Math.abs(speed)>.5)status.textContent='مساء هادئ… امضِ على مهل، فالخير في الطريق';}
camera.position.x=THREE.MathUtils.damp(camera.position.x,bike.position.x*.52,2.5,dt);camera.position.y=THREE.MathUtils.damp(camera.position.y,4.1,2,dt);camera.position.z=THREE.MathUtils.damp(camera.position.z,bike.position.z+8.7,2.5,dt);target.set(bike.position.x*.4,1.2,bike.position.z-7);camera.lookAt(target);
motes.position.z=((bike.position.z*.3)%80);if(bike.position.z<-260){bike.position.z=8;status.textContent='وصلت إلى مشارف المسجد. خذ لحظة للتأمل.'}
}renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8))});
</script></body></html>
